# // ai-generated: persistent server with the embedded HTTPS panel.
name: olcrtc-docker
services:
  server:
    image: ${OLCRTC_IMAGE:-ghcr.io/cmzmozg/olcrtc:latest}
    network_mode: host
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    volumes:
      - ./data:/etc/olcrtc
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
